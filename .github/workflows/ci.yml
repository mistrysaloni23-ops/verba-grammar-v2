name: Verify Verba
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Server tests, type check and production build
        run: npm run check
      - name: Compile Cloudflare Pages Functions
        run: npm run pages:build
      - name: Smoke-test local Cloudflare Pages runtime
        run: npm run test:pages
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile tests (mocked Gemini)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-lockfile
          path: |
            package-lock.json
            dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
