name: Check production desktop and mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-browser.yml
      - scripts/browser-live.ts
permissions:
  contents: read
concurrency:
  group: verba-production-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test the deployed website with real endpoints and Turnstile
        run: node scripts/browser-live.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser
          path: reports/live-browser/
          retention-days: 7
